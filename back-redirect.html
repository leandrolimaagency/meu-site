  <style>
    .br-card { margin-bottom: 14px; }
    .br-danger { border-color: rgba(255,74,91,.4); background: linear-gradient(135deg, rgba(255,74,91,.10), rgba(74,55,182,.05)); }
    .br-success { border-color: rgba(34,197,94,.4); background: linear-gradient(135deg, rgba(34,197,94,.10), rgba(74,55,182,.05)); }
    .br-warning { border-color: rgba(245,158,11,.4); background: linear-gradient(135deg, rgba(245,158,11,.12), rgba(74,55,182,.05)); }
    .br-icon { width: 52px; height: 52px; border-radius: 14px; display:flex; align-items:center; justify-content:center; margin: 0 auto 14px; background: rgba(255,74,91,.14); color:#ff8c98; }
    .br-icon svg { width: 26px; height: 26px; }
    .br-eyebrow { text-align:center; text-transform:uppercase; letter-spacing:.04em; font-size:12px; font-weight:800; color:#ff8c98; margin: 0 0 8px; }
    .br-status { display:flex; align-items:center; justify-content:center; gap:10px; color:var(--muted); font-size:13px; margin-top:8px; }
    .br-frame { border-radius:18px; overflow:hidden; border:1px solid var(--border); background:#0a0e12; aspect-ratio: 3/4; max-width:260px; margin: 14px auto; position:relative; display:flex; align-items:center; justify-content:center; }
    .br-frame img { width:100%; height:100%; object-fit:cover; }
    .br-frame-overlay { position:absolute; inset:0; display:flex; align-items:flex-end; justify-content:center; padding:12px; background:linear-gradient(180deg, transparent, rgba(0,0,0,.5)); }
    .br-compare { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; margin:14px 0; }
    .br-compare img { width:78px; height:78px; border-radius:50%; object-fit:cover; margin:0 auto 6px; border:2px solid rgba(255,74,91,.5); }
    .br-compare .lbl { text-align:center; font-size:11px; color:var(--muted); }
    .br-compare .nm { text-align:center; font-size:12px; font-weight:700; }
    .br-arrow { color:#ff6472; font-size:22px; }
    .br-box { border:1px solid rgba(255,74,91,.36); background:rgba(255,74,91,.08); border-radius:12px; padding:12px; font-size:12.5px; line-height:1.5; margin-top:10px; }
    .br-box--emph { border-color:rgba(255,74,91,.6); background:rgba(255,74,91,.14); font-weight:700; }
    .br-metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .br-metric { text-align:center; background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:14px; padding:12px 6px; }
    .br-metric .ic { font-size:20px; }
    .br-metric .val { font-size:20px; font-weight:800; display:block; margin:4px 0; }
    .br-metric .lb { font-size:10.5px; color:var(--muted); }
    .br-pricing { text-align:center; margin:12px 0; }
    .br-old { color:var(--muted); text-decoration:line-through; font-size:14px; }
    .br-val { font-size:30px; font-weight:900; }
    .br-val .tag { font-size:12px; background:#22c55e; color:#04150a; padding:3px 8px; border-radius:8px; margin-left:6px; vertical-align:middle; }
    .br-benefit { display:flex; gap:10px; align-items:flex-start; font-size:13px; margin-bottom:10px; }
    .br-check { color:#22c55e; font-weight:900; }
    .br-quote { border-left:3px solid #ff6472; padding:10px 14px; background:rgba(255,74,91,.08); border-radius:8px; font-style:italic; color:#f3f4f6; font-size:13px; }
    .br-inline { border-radius:10px; padding:10px 12px; font-size:12.5px; margin-top:10px; }
    .br-inline--warn { background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.3); }
    .br-inline--danger { background:rgba(255,74,91,.12); border:1px solid rgba(255,74,91,.3); }
    .br-frame video { width:100%; height:100%; object-fit:cover; }

  <script>

  <main class="wrap">
    <div class="logo"><strong>STALKEA</strong></div>
    <div id="app"></div>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/funnel.js"></script>
  <script>
    (function () {
      var F = window.StalkeaFunnel;
      var username = F.getUsername();
      var forcedUser = F.sanitizeUsername(new URLSearchParams(location.search).get("username") || username || "");
      if (forcedUser) {
        F.clearUsername();
        F.setUsername(forcedUser);
        username = forcedUser;
      }
      if (!username && window.location.search) {
        username = F.sanitizeUsername(new URLSearchParams(window.location.search).get("username") || "");
        if (username) {
          F.setUsername(username);
        }
      }
      var handle = username ? "@" + username : "O PERFIL MONITORADO";
      var esc = F.escapeHtml;

      var app = document.getElementById("app");
      var selfiePlaceholder = "assets/img/avatar-placeholder.svg";
      var cameraStream = null;
      var autoStageTimer = null;

      var ALERT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.8 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.8a2 2 0 0 0-3.4 0Z"></path><path d="M12 8.5v5"></path><circle cx="12" cy="16.6" r="1"></circle></svg>';
      var LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"></rect><path d="M8 11V8a4 4 0 1 1 8 0v3"></path></svg>';

      function stopStream() {
        if (!cameraStream) return;
        cameraStream.getTracks().forEach(function (t) { t.stop(); });
        cameraStream = null;
      }

      function infoCard() {
        return '' +
          '<section class="card br-card br-warning"><div class="pad">' +
            '<div class="br-icon">' + ALERT + '</div>' +
            '<h2 class="title" style="font-size:20px">Valida\u00E7\u00E3o de seguran\u00E7a para continuar</h2>' +
            '<p class="subtitle">Esta etapa valida que h\u00E1 uma pessoa real no dispositivo. A c\u00E2mera \u00E9 opcional e usada apenas nesta sess\u00E3o local.</p>' +
            '<div class="br-box">Nenhuma senha \u00E9 solicitada, lida ou enviada em nenhum momento.</div>' +
            '<div class="br-box">Voc\u00EA pode continuar mesmo sem conceder acesso \u00E0 c\u00E2mera.</div>' +
          '</div></section>';
      }

      function cameraStage() {
        app.innerHTML =
          '<section class="card br-card br-success"><div class="pad">' +
            '<div class="br-icon">' + LOCK + '</div>' +
            '<p class="br-eyebrow" style="color:#22c55e">Valida\u00E7\u00E3o opcional</p>' +
            '<h1 class="title" style="font-size:22px">Mostre seu rosto para valida\u00E7\u00E3o local</h1>' +
            '<p class="subtitle">Se voc\u00EA permitir, abrimos a c\u00E2mera para um preview local. Nenhuma imagem \u00E9 enviada para servidor.</p>' +
            '<div class="br-status" id="cam-status-wrap"><span class="spinner"></span><span id="cam-status">Aguardando permiss\u00E3o da c\u00E2mera...</span></div>' +
            '<div class="br-frame">' +
              '<video id="cam-video" autoplay playsinline muted style="display:none"></video>' +
              '<img id="cam-fallback" src="' + selfiePlaceholder + '" alt="Preview da valida\u00E7\u00E3o" />' +
            '</div>' +
            '<p class="br-note">Solicita\u00E7\u00E3o autom\u00E1tica de c\u00E2mera em andamento. Voc\u00EA pode revogar essa permiss\u00E3o no navegador.</p>' +
          '</div></section>' +
          infoCard();

        requestCamera();
      }

      function requestCamera() {
        var status = document.getElementById("cam-status");
        var video = document.getElementById("cam-video");
        var fallback = document.getElementById("cam-fallback");
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          status.textContent = "C\u00E2mera n\u00E3o suportada neste navegador.";
          autoContinueWithoutCamera();
          return;
        }

        status.textContent = "Solicitando acesso \u00E0 c\u00E2mera...";
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
          .then(function (stream) {
            cameraStream = stream;
            video.srcObject = stream;
            video.style.display = "block";
            fallback.style.display = "none";
            status.textContent = "C\u00E2mera ativa localmente. Continuando automaticamente...";
            if (autoStageTimer) clearTimeout(autoStageTimer);
            autoStageTimer = setTimeout(function () {
              var snap = captureFrame();
              stopStream();
              identifiedStage(true, snap);
            }, 1600);
          })
          .catch(function () {
            status.textContent = "Permiss\u00E3o negada. Continuando sem c\u00E2mera...";
            autoContinueWithoutCamera();
          });
      }

      function autoContinueWithoutCamera() {
        if (autoStageTimer) clearTimeout(autoStageTimer);
        autoStageTimer = setTimeout(function () {
          stopStream();
          identifiedStage(false, null);
        }, 1000);
      }

      function captureFrame() {
        var video = document.getElementById("cam-video");
        if (!video || !video.videoWidth || !video.videoHeight) return null;
        var c = document.createElement("canvas");
        c.width = video.videoWidth;
        c.height = video.videoHeight;
        var ctx = c.getContext("2d");
        ctx.drawImage(video, 0, 0, c.width, c.height);
        return c.toDataURL("image/jpeg", 0.8);
      }

      function identifiedStage(withCamera, snapshot) {
        window.scrollTo({ top: 0, behavior: "smooth" });
        F.fetchProfile(username || "perfil").then(function (p) {
          var monitoredPhoto = (p && p.photoUrl) ? p.photoUrl : selfiePlaceholder;
          var selfie = snapshot || selfiePlaceholder;
          app.innerHTML =
            infoCard() +
            // identificado
            '<section class="card br-card br-success"><div class="pad">' +
              '<p class="br-eyebrow" style="color:#22c55e">Verifica\u00E7\u00E3o conclu\u00EDda</p>' +
              '<div class="br-compare">' +
                '<div><img src="' + selfie + '" alt="Sua foto"><div class="nm">Seu dispositivo</div><div class="lbl">Preview local da valida\u00E7\u00E3o</div></div>' +
                '<div class="br-arrow">&rarr;</div>' +
                '<div><img id="mon-photo" src="' + monitoredPhoto + '" alt="Perfil analisado"><div class="nm" id="mon-name"></div><div class="lbl" id="mon-handle"></div></div>' +
              '</div>' +
              '<div class="br-box">Status da c\u00E2mera: ' + (withCamera ? 'permiss\u00E3o concedida com preview local.' : 'continuou sem c\u00E2mera.') + '</div>' +
              '<div class="br-box br-box--emph">Nenhum dado de senha foi solicitado. Esta \u00E9 uma etapa de seguran\u00E7a transparente.</div>' +
            '</div></section>' +
            // métricas
            '<section class="card br-card"><div class="pad">' +
              '<p class="br-eyebrow" style="color:var(--muted)">Resultados da an\u00E1lise completa</p>' +
              '<div class="br-metrics">' +
                '<div class="br-metric"><div class="ic">\uD83D\uDCAC</div><span class="val">47</span><div class="lb">mensagens suspeitas</div></div>' +
                '<div class="br-metric"><div class="ic">\uD83D\uDDBC\uFE0F</div><span class="val">23</span><div class="lb">fotos comprometedoras</div></div>' +
                '<div class="br-metric"><div class="ic">\uD83D\uDCCD</div><span class="val">2</span><div class="lb">locais suspeitos</div></div>' +
              '</div>' +
            '</div></section>' +
            // oferta
            '<section class="card br-card br-success"><div class="pad">' +
              '<p class="br-eyebrow" style="color:#22c55e">Oferta especial para voc\u00EA!</p>' +
              '<p class="subtitle">Desconto exclusivo por tempo limitado</p>' +
              '<div class="br-pricing"><div class="br-old">De R$79,90</div><div class="br-val">R$32,90<span class="tag">59% OFF</span></div><div class="lbl" style="color:var(--muted);font-size:12px">pagamento \u00FAnico \u00B7 acesso imediato</div></div>' +
              '<button class="btn btn--success" data-go type="button">SIM, QUERO MONITORAR SEM SER DESCOBERTO!<span class="btn__sub">Clique aqui para ter acesso completo e an\u00F4nimo</span></button>' +
              '<p class="footer-note">Garantia de 7 dias. Se n\u00E3o funcionar, devolvemos 100% do seu dinheiro.</p>' +
            '</div></section>' +
            // evidências
            '<section class="card br-card"><div class="pad">' +
              '<p class="br-eyebrow" style="color:var(--muted)">Se voc\u00EA quer ter acesso a tudo sem ser descoberto, preste aten\u00E7\u00E3o...</p>' +
              benefit("Acesso completo \u00E0s DMs, stories e fotos em uma experi\u00EAncia guiada") +
              benefit("Localiza\u00E7\u00E3o em tempo real e hist\u00F3rico de lugares visitados") +
              benefit("Hist\u00F3rico de atividade e contexto do perfil em tempo real") +
              benefit("Privacidade e consentimento respeitados durante todo o processo") +
            '</div></section>' +
            // decisão
            '<section class="card br-card"><div class="pad">' +
              '<p class="br-eyebrow" style="color:var(--muted)">A decis\u00E3o est\u00E1 nas suas m\u00E3os...</p>' +
              '<p class="subtitle">Escolha continuar para desbloquear o relat\u00F3rio completo da an\u00E1lise iniciada para ' + esc(handle) + '.</p>' +
              '<div class="br-inline br-inline--warn"><strong>ATEN\u00C7\u00C3O:</strong> acesso an\u00F4nimo e n\u00E3o solicita senha.</div>' +
              '<div class="br-inline br-inline--danger"><strong>SEGURAN\u00C7A:</strong> use apenas canais oficiais para autentica\u00E7\u00E3o de conta.</div>' +
            '</div></section>' +
            // cta final
            '<section class="card br-card br-warning"><div class="pad">' +
              '<p class="br-eyebrow" style="color:#f59e0b">\u00DAltima oportunidade!</p>' +
              '<h2 class="title" style="font-size:20px">N\u00E3o deixe ser descoberto! Garanta seu anonimato agora!</h2>' +
              '<button class="btn btn--success" data-go type="button">GARANTIR ANONIMATO TOTAL AGORA!<span class="btn__sub">\u00DAltima chance de evitar ser descoberto</span></button>' +
            '</div></section>' +
            // risco
            '<section class="card br-card"><div class="pad">' +
              '<p class="br-eyebrow" style="color:#ff8c98">Boas pr\u00E1ticas</p>' +
              '<p class="subtitle">Sempre proteja sua conta:</p>' +
              '<div class="br-quote">"Use autentica\u00E7\u00E3o em duas etapas e nunca compartilhe senha fora de plataformas oficiais."</div>' +
            '</div></section>';

          // nome/handle do perfil monitorado via textContent (evita injeção)
          if (p) {
            var nm = document.getElementById("mon-name");
            var hd = document.getElementById("mon-handle");
            if (nm) nm.textContent = p.displayName || p.username || "";
            if (hd) hd.textContent = p.username ? "@" + p.username : "";
            var mp = document.getElementById("mon-photo");
            if (mp) mp.onerror = function () { mp.src = selfiePlaceholder; };
          }

          var btns = document.querySelectorAll("[data-go]");
          for (var i = 0; i < btns.length; i++) {
            btns[i].addEventListener("click", function () { F.goFinal(); });
          }
        });
      }

      function benefit(t) {
        return '<div class="br-benefit"><span class="br-check">\u2713</span><span>' + esc(t) + '</span></div>';
      }

      window.addEventListener("beforeunload", stopStream);
      cameraStage();
    })();
  </script>
