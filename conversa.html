  <meta charset="utf-8" />

  <title>Direct</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="assets/ig.css" />
</head>
<body>
  <div class="ig-app">
    <div class="cv-head">
      <svg class="ico" id="back" viewBox="0 0 24 24" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      <img class="cv-ava" id="cv-ava" src="assets/img/avatar-placeholder.svg" alt="" />
      <div class="cv-id"><b id="cv-name">—</b><span id="cv-status">Ativo recentemente</span></div>
      <svg class="ico" viewBox="0 0 24 24" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" data-unlock><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2"></rect></svg>
      <svg class="ico" viewBox="0 0 24 24" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" data-unlock><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
    </div>

    <div class="cv-thread" id="thread"></div>
  </div>

  <!-- barra bloqueada + input -->
  <div class="cv-locked-bar" id="locked-bar" data-unlock>
    🔒 Mensagens bloqueadas — avaliação expira em <span class="clk" id="clk">10:00</span> · toque para desbloquear
  </div>
  <div class="cv-input" data-unlock>
    <svg class="ic" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
    <div class="box">Mensagem...</div>
    <svg class="ic" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path></svg>
    <svg class="ic" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/funnel.js"></script>
  <script src="assets/ig-data.js"></script>
  <script>
    (function () {
      var F = window.StalkeaFunnel;
      F.armBackRedirect();

      var username = F.getUsername() || "perfil_privado";
      var idx = parseInt(F.getParam("c"), 10);
      if (isNaN(idx)) idx = 0;
      var conv = IG_DATA.conversations[idx] || IG_DATA.conversations[0];
      var thread = (IG_DATA.threads && IG_DATA.threads[idx]) || {
        status: "Ativo recentemente",
        msgs: [
          { from: "them", type: "text", text: "essa conversa é só nossa 🤫", time: "agora" },
          { from: "them", type: "photo", time: "agora" },
        ],
      };

      // cabeçalho
      document.getElementById("cv-name").textContent = conv.name;
      document.getElementById("cv-status").textContent = thread.status || "Ativo recentemente";
      // avatar do contato: foto real embaçada (fallback = iniciais)
      var cvAva = document.getElementById("cv-ava");
      cvAva.className = "cv-ava ava-blur";
      cvAva.onerror = function () { cvAva.src = F.avatarDataUri(conv.name, idx); cvAva.className = "cv-ava"; };
      cvAva.src = "https://picsum.photos/seed/stkdm" + idx + "/120/120";

      // fotos reais borradas para bolhas de imagem
      function photoUrl(seed) { return "https://picsum.photos/seed/stkph" + seed + "/300/400"; }
      var LOCK = '<svg class="lock" viewBox="0 0 24 24" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2.5"></rect><path d="M8 11V8a4 4 0 1 1 8 0v3"></path></svg>';

      var t = document.getElementById("thread");
      var html = '<div class="cv-day">HOJE</div>';
      thread.msgs.forEach(function (m, i) {
        var side = m.from === "me" ? "me" : "them";
        if (m.type === "photo") {
          html += '<div class="msg-photo ' + side + '"><div class="frame"><img src="' + photoUrl(idx + "_" + i) + '" alt="" onerror="this.style.display=\'none\'" />' + LOCK + '</div></div>';
        } else if (m.type === "audio") {
          html += '<div class="msg ' + side + ' msg-audio"><span class="play">▶</span><span class="wave"></span><span class="dur">' + F.escapeHtml(m.dur || "0:30") + '</span></div>';
        } else {
          html += '<div class="msg ' + side + '"><span class="blurred">' + F.escapeHtml(m.text) + '</span></div>';
          html += '<span class="msg-time ' + side + '">' + F.escapeHtml(m.time || "") + '</span>';
        }
      });
      html += '<div class="cv-locked">🔒 As mensagens estão desfocadas na avaliação gratuita. Desbloqueie para ler tudo.</div>';
      t.innerHTML = html;

      // countdown
      var clk = document.getElementById("clk");
      var ct = setInterval(function () {
        var rem = F.trialRemainingMs();
        clk.textContent = F.formatClock(rem);
        if (rem <= 0) { clearInterval(ct); F.goFinal(); }
      }, 1000);
      clk.textContent = F.formatClock(F.trialRemainingMs());

      // navegação
      document.getElementById("back").addEventListener("click", function () {
        window.location.href = F.withUsername("direct.html", username);
      });
      function goUnlock() { F.goFinal(); }
      document.addEventListener("click", function (e) {
        if (e.target.closest && e.target.closest("#back")) return;
        var el = e.target.closest ? e.target.closest("[data-unlock]") : null;
        if (el) { goUnlock(); return; }
        if (e.target.closest && (e.target.closest(".msg") || e.target.closest(".msg-photo"))) goUnlock();
      });
    })();
  </script>
</body>
</html>
