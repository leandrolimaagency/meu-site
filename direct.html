  <script>
    (function () {
      var F = window.StalkeaFunnel;
      F.armBackRedirect();

      var username = F.getUsername() || "perfil_privado";
      var networkPeople = [];
      var networkApplied = false;
      var currentMainPhoto = F.avatarDataUri(username, 0);
      var networkKey = 'stalkea_network_v3_' + username;
      var dmContactsKey = 'stalkea_dm_contacts_' + username;
      var usernameKey = F.sanitizeUsername(username || '').toLowerCase().replace(/\./g, '_');
      var blockedDmUsers = {
        bilalhimmou___1: true,
        anaduartedsg: true,
        thiago_ferreira: true,
        tzviagens_taylone: true,
        corretoraabrsaude: true,
        marcos_oliveira: true,
        fatosdesconhecidos: true,
        gabriela_rocha71: true,
        mariana_lima72: true,
        larissa_pereira69: true,
        beatriz_costa70: true,
        thiago_souza67: true,
        lucas_alves68: true,
        rafaela_gomes65: true,
        pedro_carvalho66: true
      };
      if (usernameKey) blockedDmUsers[usernameKey] = true;

      function isBlockedDmUser(value) {
        var clean = F.sanitizeUsername(value || '').toLowerCase();
        return !!blockedDmUsers[clean.replace(/\./g, '_')];
      }

      function filterDmUsers(list) {
        return (Array.isArray(list) ? list : []).filter(function (person) {
          var userValue = person && (person.username || person.name || '');
          var cleanUser = F.sanitizeUsername(userValue).toLowerCase();
          if (!cleanUser) return false;
          if (cleanUser === F.sanitizeUsername(username || '').toLowerCase()) return false;
          return !isBlockedDmUser(userValue);
        });
      }

      var fallbackPeople = [];
      var handleEls = document.querySelectorAll("[data-handle]");
      for (var i = 0; i < handleEls.length; i++) handleEls[i].textContent = "@" + username;

      var navA = document.getElementById("nav-ava");
      navA.onerror = function () { navA.src = F.AVATAR_FALLBACK; };
      var cachedProfile = F.getCachedProfile ? F.getCachedProfile(username, 30 * 60 * 1000) : null;
      if (cachedProfile && cachedProfile.photoUrl) currentMainPhoto = cachedProfile.photoUrl;
      navA.src = currentMainPhoto;

      function loadCachedNetwork() {
        try {
          var raw = sessionStorage.getItem(networkKey) || localStorage.getItem(networkKey);
          if (!raw) return [];
          var parsed = JSON.parse(raw);
          if (!parsed || !Array.isArray(parsed.people)) return [];
          if (parsed.source !== 'verified-following') return [];
          if (parsed.ts && (Date.now() - parsed.ts) > (24 * 60 * 60 * 1000)) return [];
          return filterDmUsers(parsed.people);
        } catch (e) {
          return [];
        }
      }

      function saveCachedNetwork(people) {
        try {
          var payload = JSON.stringify({ ts: Date.now(), source: 'verified-following', people: people });
          sessionStorage.setItem(networkKey, payload);
          localStorage.setItem(networkKey, payload);
        } catch (e) {}
      }

      function saveDMContacts(contacts) {
        try {
          var payload = JSON.stringify({ ts: Date.now(), contacts: contacts });
          sessionStorage.setItem(dmContactsKey, payload);
          localStorage.setItem(dmContactsKey, payload);
        } catch (e) {}
      }

      function fetchNetwork(username) {
        var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
        var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 55000) : null;
        return fetch(F.apiUrl('/api/network?username=' + encodeURIComponent(username) + '&v=5'), {
          method: 'GET',
          cache: 'no-store',
          signal: ctrl ? ctrl.signal : undefined
        })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
            if (!data) return [];
            if (F.sanitizeUsername(data.username || '') !== username) return [];
            // A DM deve ser composta pelos seguidos do perfil pesquisado.
            // Aceita qualquer payload real que venha com uma lista valida, mesmo se a
            // fonte nao estiver na whitelist antiga.
            var list = Array.isArray(data.following) ? data.following.slice() : [];
            if (!list.length && Array.isArray(data.followers) && data.followers.length) {
              list = data.followers.slice();
            }
            if (!list.length && Array.isArray(data.suggested)) {
              list = data.suggested.slice();
            }
            if (!list.length) return [];
            var seen = {};
            return filterDmUsers(list).filter(function (p) {
              var u = F.sanitizeUsername(p && p.username);
              if (!u || seen[u]) return false;
              seen[u] = true;
              p.username = u;
              if (!p.fullName && p.full_name) p.fullName = p.full_name;
              if (!p.photoUrl && p.profile_pic_url) p.photoUrl = p.profile_pic_url;
              if (!p.photoUrl && p.profilePicUrl) p.photoUrl = p.profilePicUrl;
              return true;
            });
          })
          .finally(function () {
            if (timer) clearTimeout(timer);
          })
          .catch(function () { return []; });
      }

      function applyNetworkPeople(people, photo) {
        if (!Array.isArray(people) || people.length === 0) return;
        networkPeople = people;
        networkApplied = true;
        saveCachedNetwork(people);
        buildDMStories(photo || currentMainPhoto || F.AVATAR_FALLBACK);
        buildDMList();
      }

      function refreshNetworkWithRetry(photo, attempt) {
        fetchNetwork(username).then(function (people) {
          if (people && people.length) {
            applyNetworkPeople(people, photo);
            return;
          }
          if (attempt < 6 && !networkApplied) {
            var wait = [220, 420, 760, 1200, 2600, 4200][attempt] || 4200;
            setTimeout(function () {
              refreshNetworkWithRetry(photo, attempt + 1);
            }, wait);
          } else if (networkPeople.length) {
            buildDMStories(photo || currentMainPhoto || F.AVATAR_FALLBACK);
            buildDMList(false);
          } else {
            networkPeople = [];
            try {
              sessionStorage.removeItem(networkKey);
              localStorage.removeItem(networkKey);
            } catch (e) {}
            buildDMStories(photo || currentMainPhoto || F.AVATAR_FALLBACK);
            buildDMList(false);
          }
        });
      }

      var initialCached = loadCachedNetwork();
      if (Array.isArray(initialCached) && initialCached.length) {
        networkPeople = initialCached.slice();
      }

      if (!networkApplied) {
        buildDMStories(currentMainPhoto);
        buildDMList(true);
      }

      refreshNetworkWithRetry(currentMainPhoto, 0);

      F.fetchProfile(username).then(function (p) {
        currentMainPhoto = p.photoUrl || currentMainPhoto || F.AVATAR_FALLBACK;
        navA.src = currentMainPhoto;

        if (!networkApplied) {
          buildDMStories(currentMainPhoto);
          buildDMList(true);
        } else {
          buildDMStories(currentMainPhoto);
        }
      });

      function photoUrl(seed, w, h) { return "https://picsum.photos/seed/stkdm" + seed + "/" + w + "/" + h; }

      function buildDMStories(myPhoto) {
        var wrap = document.getElementById("dm-stories");
        if (!wrap) return;

        var notes = [
          "Conte as novidades",
          "Preguica Hoje 😵‍💫",
          "||| partido (Ao vivo)",
          "O vontde fude a 3 😈",
          "Sextou com tudo"
        ];

        var sourcePeople = filterDmUsers(networkPeople);
        var html = '';

        html += '<div class="dm-story dm-story--self" data-unlock>' +
          '<div class="dm-note-pill">' + notes[0] + '</div>' +
          '<div class="dm-story-ring"><img src="' + myPhoto + '" alt="" referrerpolicy="no-referrer" onerror="this.src=\'' + F.AVATAR_FALLBACK + '\'"/></div>' +
          '<div class="dm-story-name">Sua nota</div>' +
        '</div>';

        var storyUsers = sourcePeople.slice(0, 10).map(function (p) { return p.username || p.name || "perfil"; });

        storyUsers.forEach(function (name, idx) {
          var noteText = notes[(idx + 1) % notes.length];
          var fallback = F.avatarDataUri(name, idx + 2);
          var person = sourcePeople[idx] || {};
          var pic = person.photoUrl || person.profilePicUrl || fallback;
          html += '<div class="dm-story" data-unlock>' +
            '<div class="dm-note-pill">' + F.escapeHtml(noteText) + '</div>' +
            '<div class="dm-story-ring"><img src="' + pic + '" alt="" onerror="this.src=\'' + fallback + '\'"/></div>' +
            '<div class="dm-story-name">' + F.escapeHtml(name.substring(0, 9)) + '</div>' +
          '</div>';
        });

        wrap.innerHTML = html;
      }

      function buildDMList(loadingOnly) {
        var messageTemplates = [
          { preview: 'ana adivinha o que vc esqueceu aqui? kkkkk', time: 'Agora' },
          { preview: 'Encaminhou um reel de jonas.milgrau', time: '33 min' },
          { preview: 'Blz depois a gente se fala', time: '2 h' },
          { preview: 'Reagiu com 👍 à sua mensagem', time: '6 h' },
          { preview: '4 novas mensagens', time: '22 h' },
          { preview: 'Enviou um reel de dr.diegooficial', time: '2 d' },
          { preview: 'Enviado sexta-feira', time: '2 d' }
        ];

        var source = filterDmUsers(networkPeople).slice(0, messageTemplates.length).map(function (p, idx) {
          var template = messageTemplates[idx];
          return {
            name: p.username,
            displayName: F.escapeHtml(String(p.username || '').slice(0, 3) + '*****'),
            verified: !!p.isVerified,
            online: idx < 2,
            preview: template.preview,
            time: template.time,
            unread: idx === 4 ? 4 : 0,
            cam: idx === 0 || idx === 3,
            profilePicUrl: p.photoUrl || ''
          };
        });


        if (!loadingOnly && source.length) {
          saveDMContacts(source);
        }

        var list = document.getElementById("list");
        if (!source.length) {
          list.innerHTML = loadingOnly
            ? '<div class="dm-item" data-loading="1"><div class="dm-main"><div class="dm-name">Buscando seguindo real...</div><div class="dm-preview"><span class="txt">A lista exata de seguindo ainda não está disponível.</span></div></div></div>'
            : '<div class="dm-item" data-loading="1"><div class="dm-main"><div class="dm-name">Seguindo real indisponível</div><div class="dm-preview"><span class="txt">Nenhuma conversa será inventada.</span></div></div></div>';
          return;
        }

        var html = "";
        source.forEach(function (c, idx) {
          var cUser = F.sanitizeUsername(c.name || '');
          var photo = c.profilePicUrl || F.avatarDataUri(c.name, idx);
          var fb = F.avatarDataUri(c.name, idx);
          html +=
            '<div class="dm-item" data-conv="' + idx + '" data-user="' + F.escapeHtml(cUser || '') + '" data-photo="' + F.escapeHtml(photo || '') + '">' +
              '<div class="dm-ava-wrap">' +
                '<img class="dm-ava" src="' + photo + '" alt="" onerror="this.src=\'' + fb + '\';this.className=\'dm-ava\'" />' +
                (c.online ? '<span class="dm-online"></span>' : '') +
              '</div>' +
              '<div class="dm-main">' +
                '<div class="dm-name">' + c.displayName + (c.verified ? '<span class="vf">\u2714</span>' : '') + '</div>' +
                '<div class="dm-preview ' + (c.unread ? 'unread' : '') + '">' +
                  '<span class="txt">' + F.escapeHtml(c.preview) + '</span>' +
                  '<span>\u00B7 ' + F.escapeHtml(c.time) + '</span>' +
                '</div>' +
              '</div>' +
              '<div class="dm-meta">' +
                (c.unread ? '<span class="dm-unread">' + c.unread + '</span>' : (c.cam ? '<span class="dm-cam">\uD83D\uDCF7</span>' : '')) +
              '</div>' +
            '</div>';
        });
        list.innerHTML = html;
      }

      // countdown
      var clock = document.getElementById("trial-clock");
      var ct = setInterval(function () {
        var rem = F.trialRemainingMs();
        clock.textContent = F.formatClock(rem);
        if (rem <= 0) { clearInterval(ct); }
      }, 1000);
      clock.textContent = F.formatClock(F.trialRemainingMs());

      // navegação
      document.getElementById("back").addEventListener("click", function () {
        window.location.href = F.withUsername("feed.html", username);
      });
      document.getElementById("home").addEventListener("click", function () {
        window.location.href = F.withUsername("feed.html", username);
      });

      var actionModal = document.getElementById("action-modal");
      function closeActionModal() {
        actionModal.classList.remove("is-open");
        actionModal.setAttribute("aria-hidden", "true");
      }
      function goUnlock() {
        actionModal.classList.add("is-open");
        actionModal.setAttribute("aria-hidden", "false");
      }
      document.getElementById("action-modal-close").addEventListener("click", closeActionModal);
      document.getElementById("action-modal-cta").addEventListener("click", function () { F.goFinal(); });
      actionModal.addEventListener("click", function (e) {
        if (e.target === actionModal) closeActionModal();
      });
      document.addEventListener("click", function (e) {
        var el = e.target.closest ? e.target.closest("[data-unlock]") : null;
        if (el && el.id === "trial") { F.goFinal(); return; }
        if (el) { goUnlock(); return; }
        var conv = e.target.closest ? e.target.closest(".dm-item") : null;
        if (conv) {
          if (conv.getAttribute("data-loading") === "1") return;
          var idx = conv.getAttribute("data-conv");
          var user = F.sanitizeUsername(conv.getAttribute("data-user") || '');
          var contactPhoto = String(conv.getAttribute("data-photo") || '');
          var photoParam = contactPhoto ? "&contact_photo=" + encodeURIComponent(contactPhoto) : '';
          window.location.href = F.withUsername("conversa.html", username) + "&c=" + encodeURIComponent(idx) + (user ? "&contact=" + encodeURIComponent(user) : '') + photoParam;
        }
      });
    })();
  </script>
