<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Direct</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="assets/ig.css" />
</head>
<body>
  <div class="ig-app">
    <!-- header -->
    <div class="dm-head">
      <svg class="ico" id="back" viewBox="0 0 24 24" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      <div class="title"><span data-handle>@—</span>
        <svg viewBox="0 0 24 24" width="15" height="15" stroke="#fff" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
      <svg class="ico" viewBox="0 0 24 24" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" data-unlock><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2"></rect></svg>
      <svg class="ico" viewBox="0 0 24 24" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" data-unlock><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
    </div>

    <div class="dm-search" data-unlock>
      <svg viewBox="0 0 24 24" width="16" height="16" stroke="#8e8e8e" stroke-width="2" fill="none"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
      Pesquisar
    </div>

    <div class="dm-tabs">
      <span style="color:#fff">Mensagens</span>
      <span class="req">Solicitações (4)</span>
    </div>

    <div class="dm-list" id="list"></div>
  </div>

  <!-- trial countdown -->
  <div class="trial-bar" id="trial" data-unlock>
    <span>🎁 Avaliação gratuita</span>
    <span class="trial-clock" id="trial-clock">10:00</span>
    <span class="trial-msg">Assine para não perder o acesso</span>
  </div>

  <!-- bottom nav -->
  <div class="ig-nav">
    <svg class="ig-nav-ic" id="home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h5v-6h4v6h5V9.5"></path></svg>
    <svg class="ig-nav-ic" viewBox="0 0 24 24" data-unlock><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
    <svg class="ig-nav-ic" viewBox="0 0 24 24" data-unlock><rect x="3" y="3" width="18" height="18" rx="5"></rect><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
    <svg class="ig-nav-ic active" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    <img class="ig-nav-ava" id="nav-ava" src="assets/img/avatar-placeholder.svg" alt="" referrerpolicy="no-referrer" data-unlock />
  </div>

  <script src="assets/config.js"></script>
  <script src="assets/funnel.js"></script>
  <script src="assets/ig-data.js"></script>
  <script>
    (function () {
      var F = window.StalkeaFunnel;
      F.armBackRedirect();

      var username = F.getUsername() || "perfil_privado";
      var handleEls = document.querySelectorAll("[data-handle]");
      for (var i = 0; i < handleEls.length; i++) handleEls[i].textContent = "@" + username;

      F.fetchProfile(username).then(function (p) {
        var navA = document.getElementById("nav-ava");
        navA.onerror = function () { navA.src = F.AVATAR_FALLBACK; };
        navA.src = p.photoUrl || F.AVATAR_FALLBACK;
      });

      // lista de conversas fictícias
      var list = document.getElementById("list");
      var html = "";
      IG_DATA.conversations.forEach(function (c, idx) {
        var photo = "https://picsum.photos/seed/stkdm" + idx + "/120/120";
        var fb = F.avatarDataUri(c.name, idx);
        html +=
          '<div class="dm-item" data-conv="' + idx + '">' +
            '<div class="dm-ava-wrap">' +
              '<img class="dm-ava ava-blur" src="' + photo + '" alt="" onerror="this.src=\'' + fb + '\';this.className=\'dm-ava\'" />' +
              (c.online ? '<span class="dm-online"></span>' : '') +
            '</div>' +
            '<div class="dm-main">' +
              '<div class="dm-name">' + F.escapeHtml(c.name) + (c.verified ? '<span class="vf">✔</span>' : '') + '</div>' +
              '<div class="dm-preview ' + (c.unread ? 'unread' : '') + '">' +
                '<span class="txt blurred">' + F.escapeHtml(c.preview) + '</span>' +
                '<span>· ' + F.escapeHtml(c.time) + '</span>' +
              '</div>' +
            '</div>' +
            '<div class="dm-meta">' +
              (c.unread ? '<span class="dm-unread">' + c.unread + '</span>' : (c.cam ? '<span class="dm-cam">📷</span>' : '')) +
            '</div>' +
          '</div>';
      });
      list.innerHTML = html;

      // countdown
      var clock = document.getElementById("trial-clock");
      var ct = setInterval(function () {
        var rem = F.trialRemainingMs();
        clock.textContent = F.formatClock(rem);
        if (rem <= 0) { clearInterval(ct); F.goFinal(); }
      }, 1000);
      clock.textContent = F.formatClock(F.trialRemainingMs());

      // navegação
      document.getElementById("back").addEventListener("click", function () {
        window.location.href = F.withUsername("feed.html", username);
      });
      document.getElementById("home").addEventListener("click", function () {
        window.location.href = F.withUsername("feed.html", username);
      });

      function goUnlock() { F.goFinal(); }
      document.addEventListener("click", function (e) {
        var el = e.target.closest ? e.target.closest("[data-unlock]") : null;
        if (el) { goUnlock(); return; }
        var conv = e.target.closest ? e.target.closest(".dm-item") : null;
        if (conv) {
          var idx = conv.getAttribute("data-conv");
          window.location.href = F.withUsername("conversa.html", username) + "&c=" + encodeURIComponent(idx);
        }
      });
    })();
  </script>
</body>
</html>
