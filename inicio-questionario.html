  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="robots" content="noindex,nofollow" />
  <title>STALKEA | Question&aacute;rio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap&subset=latin,latin-ext" />
  <link rel="stylesheet" href="assets/styles.css" />
  <script src="assets/hacker-bg.js" defer></script>
  <style>
    body {
      background:
        radial-gradient(circle at top, rgba(74,55,182,.22), transparent 35%),
        linear-gradient(180deg, #040607, #040607);
    }
    .card { overflow: hidden; }
    .q-box { display: grid; gap: 16px; }
    .options { display: grid; gap: 10px; }
    .option {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 14px 16px; border-radius: 14px; border: 1px solid var(--border);
      background: rgba(255,255,255,.03); color: var(--text); font-weight: 700; text-align: left;
      cursor: pointer;
    }
    .option:hover { border-color: rgba(171,88,244,.48); }
    .circle {
      width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255,255,255,.45);
      display: inline-block; flex: 0 0 auto;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="logo"><strong>STALKEA</strong></div>

    <div class="card">
      <div class="pad q-box">
        <div class="pill pill--live"><span class="dot"></span> QUESTION&Aacute;RIO</div>
        <h1 class="title">Qual &eacute; o sexo do seu c&ocirc;njuge?</h1>
        <p class="subtitle">Essa sele&ccedil;&atilde;o ajuda a personalizar a an&aacute;lise e a segmentar o perfil ideal para a verifica&ccedil;&atilde;o.</p>

        <div class="field" style="margin-top: 14px; margin-bottom: 14px;">
          <label for="start-username" style="display:block; margin-bottom:8px; font-size:12px; color:var(--muted);">Usu&aacute;rio do Instagram</label>
          <div class="input-at" style="max-width:420px; margin:0 auto;">
            <span>@</span>
            <input class="input" id="start-username" name="start-username" type="text"
                   placeholder="nomedoconjuge_10" inputmode="text" autocapitalize="none"
                   autocorrect="off" spellcheck="false" />
          </div>
        </div>

        <div class="options">
          <button class="option" type="button" data-gender="Masculino">
            <span class="circle"></span>
            Masculino
          </button>
          <button class="option" type="button" data-gender="Feminino">
            <span class="circle"></span>
            Feminino
          </button>
          <button class="option" type="button" data-gender="Prefiro n&atilde;o informar">
            <span class="circle"></span>
            Prefiro n&atilde;o informar
          </button>
        </div>

        <button class="btn btn--primary" id="continue" type="button">Continuar</button>
      </div>
    </div>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/funnel.js"></script>
  <script>
    (function () {
      var F = window.StalkeaFunnel;
      var selected = 'Masculino';
      var buttons = document.querySelectorAll('.option');
      var input = document.getElementById('start-username');
      var prefill = F.getUsername();
      if (prefill) input.value = prefill;

      buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          selected = btn.dataset.gender;
          buttons.forEach(function (b) { b.style.borderColor = 'rgba(255,255,255,0.08)'; });
          btn.style.borderColor = 'rgba(171,88,244,0.8)';
        });
      });

      document.getElementById('continue').addEventListener('click', function () {
        var u = F.sanitizeUsername(input.value);
        if (u) {
          F.setUsername(u);
          window.location.href = F.withUsername('usuario.html', u);
          return;
        }
        window.location.href = F.withUsername('usuario.html', F.getUsername());
      });
    })();
  </script>
</body>
</html>
